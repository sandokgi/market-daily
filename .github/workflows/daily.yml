name: 한국 시장 마감 정리

on:
  schedule:
    - cron: '20 8 * * 1-5'  # 매주 월~금 17:20 KST (08:20 UTC)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  send-market-summary:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install telethon requests pytz yfinance matplotlib playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 텔레그램 세션 파일 복원
        run: |
          echo "${{ secrets.TELEGRAM_SESSION }}" | base64 -d | gunzip > session.session

      - name: 실행
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          SLACK_DAILY_CHANNEL_ID: ${{ secrets.SLACK_DAILY_CHANNEL_ID }}
        run: python main.py
